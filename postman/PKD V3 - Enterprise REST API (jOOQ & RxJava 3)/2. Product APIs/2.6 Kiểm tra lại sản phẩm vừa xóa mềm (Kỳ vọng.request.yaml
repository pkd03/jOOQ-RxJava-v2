$kind: http-request
name: 2.6 Kiểm tra lại sản phẩm vừa xóa mềm (Kỳ vọng 404 NOT_FOUND)
description: Xác nhận sản phẩm đã bị soft-delete không thể truy vấn lại được.
url: "{{baseUrl}}/api/v1/products/{{productId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404 Not Found", function () {
          pm.response.to.have.status(404);
      });

      pm.test("ErrorCode is RESOURCE_NOT_FOUND", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.eql(false);
          pm.expect(jsonData.code).to.eql("RESOURCE_NOT_FOUND");
      });
    language: text/javascript
order: 6000
